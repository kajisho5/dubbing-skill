[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dubbing-skill"
version = "0.1.0"
description = "AI narration (TTS), voice replacement (dubbing) and audio description timed to the picture: local engines behind availability checks; media work through ffmpeg-skill."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "kajisho5"}]
keywords = ["tts", "dubbing", "narration", "audio-description", "chatterbox", "voicevox", "japanese", "offline", "agent-skill", "video-production"]
# stdlib only. Engines are not extras on purpose (ADR-001, ADR-002): each is installed in its own environment or run
# as its own app, and found by doctor.
dependencies = []

[project.scripts]
dubbing = "dubbing_skill.cli:main"

[project.urls]
Repository = "https://github.com/kajisho5/dubbing-skill"

[tool.setuptools.packages.find]
where = ["src"]
